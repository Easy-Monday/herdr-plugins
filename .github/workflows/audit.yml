name: audit
on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .npmrc
      - config/audit-allowlist.json
      - .github/workflows/audit.yml
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run audit
